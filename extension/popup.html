<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            font-family: Segoe UI, sans-serif;
            width: 380px;
            margin: 0;
            font-size: 13px;
        }

        header {
            background: #1e6fd9;
            color: #fff;
            padding: 10px 12px;
            font-weight: 600;
        }

        #status {
            font-weight: 400;
            font-size: 11px;
            display: block;
        }

        #list {
            max-height: 320px;
            overflow-y: auto;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-bottom: 1px solid #ddd;
        }

        .info {
            flex: 1;
            min-width: 0;
        }

        .name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .meta {
            color: #666;
            font-size: 11px;
        }

        button {
            background: #1e6fd9;
            color: #fff;
            border: 0;
            border-radius: 4px;
            padding: 6px 10px;
            cursor: pointer;
        }

        button:disabled {
            background: #999;
        }

        #empty {
            padding: 16px 12px;
            color: #666;
        }
    </style>
</head>

<body>
    <header>FlashDL <span id="status"></span></header>
    <div id="list"></div>
    <div id="empty" style="display:none">
        Aucun fichier détecté. Lance la lecture d'une vidéo ou recharge la page.
    </div>
    <script src="popup.js"></script>
</body>

</html>
